name: Zbuduj i opublikuj aplikację

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Zbuduj
        run: |
          pip install pillow
          python build.py
      - name: Sprawdź
        run: node tests/check.js
      - name: Przygotuj stronę
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist/korektor-cnc
      - name: Dołącz paczkę ZIP (do pobrania z zakładki Actions)
        uses: actions/upload-artifact@v4
        with:
          name: korektor-cnc-zip
          path: dist/korektor-cnc.zip

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
